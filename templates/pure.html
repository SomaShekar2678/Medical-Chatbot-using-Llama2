<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-green-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="p-4 bg-blue-600 flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1584982751601-97dcc096659c" alt="Medical Chat" class="w-10 h-10 rounded-full object-cover">
                <h1 class="text-xl font-semibold text-white">Medical Assistant</h1>
            </div>
            
            <div class="h-[500px] overflow-y-auto p-4 space-y-4" id="chatContainer">
                <div class="flex items-start gap-2.5">
                    <img class="w-8 h-8 rounded-full" src="https://images.unsplash.com/photo-1584982751601-97dcc096659c" alt="Medical bot">
                    <div class="flex flex-col gap-1 w-full max-w-[320px]">
                        <div class="flex items-center space-x-2 rtl:space-x-reverse">
                            <span class="text-sm font-semibold text-gray-900">Medical Bot</span>
                            <span class="text-sm font-normal text-gray-500">11:46</span>
                        </div>
                        <div class="flex flex-col leading-1.5 p-4 border-gray-200 bg-blue-100 rounded-e-xl rounded-es-xl">
                            <p class="text-sm font-normal text-gray-900">Hello! How can I assist you today with your medical queries?</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-start gap-2.5 flex-row-reverse">
                    <img class="w-8 h-8 rounded-full" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde" alt="User">
                    <div class="flex flex-col gap-1 w-full max-w-[320px]">
                        <div class="flex items-center space-x-2 rtl:space-x-reverse flex-row-reverse">
                            <span class="text-sm font-semibold text-gray-900">You</span>
                            <span class="text-sm font-normal text-gray-500">11:47</span>
                        </div>
                        <div class="flex flex-col leading-1.5 p-4 border-gray-200 bg-green-100 rounded-s-xl rounded-ee-xl">
                            <p class="text-sm font-normal text-gray-900">Hi! I have some questions about my prescription.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-4 bg-white border-t border-gray-200">
                <div class="flex items-center gap-2">
                    <div class="relative w-full">
                        <input type="text" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 ease-in-out" placeholder="Type your message..." aria-label="Chat message input">
                        <button class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600" aria-label="Attach file">
                            <i class="fas fa-paperclip text-lg"></i>
                        </button>
                    </div>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-3 transition-all duration-200 ease-in-out flex items-center justify-center" aria-label="Send message">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
